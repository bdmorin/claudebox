# Pre-commit hooks for ClaudeBox
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      # ShellCheck - Bash linting
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
        files: \.(sh|bash)$
        exclude: ^test/fixtures/
        args: []

      # Bats - Run tests (skip test #7 which has false positives)
      - id: bats
        name: Bats Tests
        entry: bash -c 'if command -v bats >/dev/null 2>&1; then bats --filter-tags "!slow" test/array_safety.bats test/config_functions.bats 2>/dev/null || bats test/array_safety.bats test/config_functions.bats; else echo "⚠️  Bats not installed - skipping tests"; fi'
        language: system
        pass_filenames: false
        files: \.(sh|bash|bats)$

      # Trailing whitespace
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACM | xargs -r sed -i "" "s/[[:space:]]*$//"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^test/fixtures/

  # Security: Secret scanning with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (package-lock.json|^test/fixtures/|^test/security_scanning.bats)

  # Security: Trivy for Dockerfile scanning
  - repo: local
    hooks:
      - id: trivy-config
        name: Trivy Dockerfile Scan
        entry: bash -c 'if command -v trivy >/dev/null 2>&1; then trivy config templates/Dockerfile.template --severity CRITICAL,HIGH --exit-code 1; else echo "⚠️  Trivy not installed - skipping Dockerfile scan"; fi'
        language: system
        pass_filenames: false
        files: Dockerfile|\.ya?ml$
