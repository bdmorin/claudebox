name: Secret Scanning with TruffleHog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 4 AM UTC
    - cron: '0 4 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

      - name: Upload scan results
        if: failure()
        run: |
          printf "⚠️  TruffleHog detected verified secrets in the codebase.\n"
          printf "This is a CRITICAL security issue. Please:\n"
          printf "1. Immediately rotate any exposed credentials\n"
          printf "2. Remove secrets from code/config files\n"
          printf "3. Use environment variables instead\n"
          printf "4. Review the scan output above for details\n"
          exit 1

  detect-secrets:
    name: detect-secrets Baseline Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Create baseline if missing
        run: |
          if [[ ! -f .secrets.baseline ]]; then
            printf "Creating initial secrets baseline...\n"
            detect-secrets scan > .secrets.baseline
          fi

      - name: Scan for new secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
